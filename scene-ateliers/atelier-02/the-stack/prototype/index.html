<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier prototype</title><link rel="stylesheet" href="./styles.css"></head><body><header><div><p class="eyebrow">Atelier prototype · not Product Scene</p><h1>Calm Stack</h1></div><p>Pure story-time evaluator. Same function for play, scrub, and fixed-step capture.</p></header><main><aside aria-label="Prototype controls"><label>Fixture<select id="fixture"><option value="ordinary-eight">ordinary eight</option><option value="recommended">recommended count</option><option value="one">1 item</option><option value="two">2 items</option><option value="awkward-seven">awkward 7</option><option value="mixed">mixed ratios</option><option value="alpha">transparent soft edge</option><option value="failed">failed media</option><option value="many-24">bounded 24</option></select></label><label>Timeline<select id="mode"><option value="automatic">automatic</option><option value="fixed-duration">fixed duration</option><option value="directed">directed</option></select></label><label>Direction<select id="direction"><option value="forward">forward</option><option value="reverse">reverse</option></select></label><label>Canvas<select id="canvas"><option value="960x540">16:9</option><option value="540x960">9:16</option><option value="720x720">1:1</option><option value="800x1000">4:5</option><option value="1288x540">2576:1080</option></select></label><section id="scene-controls" class="scene-controls"></section><div class="buttons"><button id="play">Play</button><button id="restart">Restart</button><button id="capture">Capture SVG</button><button id="dispose">Dispose</button><button id="remount">Remount</button></div><label>Exact story time<input id="time" type="range" min="0" max="10000" step="1" value="0"></label><dl><div><dt>Phase</dt><dd id="phase"></dd></div><div><dt>Source video</dt><dd id="source-time"></dd></div><div><dt>Mount generation</dt><dd id="generation">1</dd></div></dl><p id="status" role="status" aria-live="polite">Ready.</p></aside><section class="stage-shell"><div id="stage" aria-label="Deterministic Scene study"></div></section></main><script type="module" src="./app.mjs"></script></body></html>
