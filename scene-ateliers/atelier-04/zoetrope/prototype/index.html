<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoetrope — deterministic atelier prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">ATELIER 04 / CLEAN-ROOM LAB</p><h1>Zoetrope</h1></div>
      <p class="promise">Fast cylindrical rhythm. Authored gate dwell. No alias theatre.</p>
    </header>
    <section class="workbench">
      <div class="stage-wrap"><div id="stage" class="stage" aria-label="Zoetrope deterministic motion study"></div></div>
      <aside aria-label="Prototype controls">
        <label>Fixture<select id="fixture"></select></label>
        <label>Canvas<select id="canvas"></select></label>
        <label>Run<select id="runKind"><option value="loop">Loop</option><option value="finite">Finite phrase</option></select></label>
        <label>Radius<input id="cylinderRadius" type="range" min="0.28" max="0.48" step="0.01" /></label>
        <label>Card size<input id="cardSize" type="range" min="0.22" max="0.42" step="0.01" /></label>
        <label>Ring tilt<input id="ringTiltDeg" type="range" min="-12" max="8" step="1" /></label>
        <label>Cadence<select id="cadenceCharacter"><option value="ratchet">Ratchet</option><option value="flywheel">Flywheel</option></select></label>
        <label>Direction<select id="direction"><option value="forward">Forward</option><option value="reverse">Reverse</option></select></label>
        <label class="check"><input id="transparent" type="checkbox" /> Transparent stage</label>
        <label class="check"><input id="reducedMotion" type="checkbox" /> Reduced motion</label>
        <div class="transport"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button></div>
        <label>Story time<input id="scrub" type="range" min="0" max="1" step="0.0005" value="0" /></label>
        <output id="time">0.000</output>
      </aside>
    </section>
    <details open><summary>Exact evaluator readback</summary><pre id="readback"></pre></details>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
