<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Shelf — deterministic atelier prototype</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">ATELIER 04 / CLEAN-ROOM LAB</p><h1>The Shelf</h1></div><p class="promise">Collected editions. One shared baseline. Natural widths, measured lean, invisible offstage recycling.</p></header>
<section class="workbench"><div class="stage-wrap"><div id="stage" class="stage" aria-label="The Shelf deterministic motion study"></div></div><aside aria-label="Prototype controls">
<label>Fixture<select id="fixture"></select></label><label>Canvas<select id="canvas"></select></label><label>Run<select id="runKind"><option value="loop">Walking loop</option><option value="finite">Spotlight / finale phrase</option></select></label>
<label>Card height<input id="cardHeight" type="range" min="0.28" max="0.58" step="0.01"></label><label>Gap<input id="gap" type="range" min="8" max="120" step="1"></label><label>Lean amount<input id="leanAmount" type="range" min="0" max="6" step="0.25"></label><label>Direction<select id="direction"><option value="forward">Forward</option><option value="reverse">Reverse</option></select></label><label>Spotlight lift<input id="spotlightLift" type="range" min="0.03" max="0.14" step="0.005"></label>
<fieldset><legend>Serialized source/Timeline intent</legend><label>Spotlight<select id="spotlightId"></select></label><label>Finale<select id="finaleId"></select></label></fieldset>
<label class="check"><input id="transparent" type="checkbox"> Transparent stage</label><label class="check"><input id="reducedMotion" type="checkbox"> Reduced motion</label><div class="transport"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button></div><label>Story time<input id="scrub" type="range" min="0" max="1" step="0.0005" value="0"></label><output id="time">0.000</output></aside></section>
<details open><summary>Exact evaluator readback</summary><pre id="readback"></pre></details></main><script type="module" src="app.mjs"></script></body></html>
