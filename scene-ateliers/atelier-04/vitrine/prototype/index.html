<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrine — deterministic atelier prototype</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">ATELIER 04 / CLEAN-ROOM LAB</p><h1>Vitrine</h1></div><p class="promise">One fully readable work. Deliberate stillness. A composed, source-faithful exchange.</p></header>
<section class="workbench"><div class="stage-wrap"><div id="stage" class="stage" aria-label="Vitrine deterministic motion study"></div></div><aside aria-label="Prototype controls">
<label>Fixture<select id="fixture"></select></label><label>Canvas<select id="canvas"></select></label><label>Run<select id="runKind"><option value="loop">Automatic loop</option><option value="finite">Finite ceremonial phrase</option></select></label>
<label>Presentation scale<input id="presentationScale" type="range" min="0.42" max="0.78" step="0.01"></label><label>Object turn amplitude<input id="objectTurnAmplitude" type="range" min="0" max="9" step="0.25"></label><label>Transition depth<input id="transitionDepth" type="range" min="0.08" max="0.30" step="0.01"></label><label>Transition direction<select id="transitionDirection"><option value="left">Outgoing left</option><option value="right">Outgoing right</option></select></label><label class="check"><input id="placardVisibility" type="checkbox"> Placard</label>
<fieldset><legend>Serialized source/Timeline intent</legend><label>Direction<select id="timelineDirection"><option value="forward">Forward</option><option value="reverse">Reverse</option></select></label><label>Spotlight<select id="spotlightId"></select></label><label>Finale<select id="finaleId"></select></label></fieldset>
<label class="check"><input id="transparent" type="checkbox"> Transparent stage</label><label class="check"><input id="reducedMotion" type="checkbox"> Reduced motion</label><div class="transport"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button></div><label>Story time<input id="scrub" type="range" min="0" max="1" step="0.0005" value="0"></label><output id="time">0.000</output></aside></section>
<details open><summary>Exact evaluator readback</summary><pre id="readback"></pre></details></main><script type="module" src="app.mjs"></script></body></html>
