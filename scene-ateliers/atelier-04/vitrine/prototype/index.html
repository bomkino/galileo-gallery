<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Vitrine candidate</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0c0c0b;color:#f4f0e8}main{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px}.bar,.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar h1{margin:0;font:600 20px Georgia,serif}.bar p{margin:0;color:#aaa49a;font-size:12px}.stage{position:relative;min-height:420px;overflow:hidden;border:1px solid #38372f;border-radius:18px;background:#11110f}.card{position:absolute;left:50%;top:50%;width:min(58%,520px);aspect-ratio:16/10;display:grid;place-items:center;border-radius:8px;background:var(--c);color:#11110f;font:700 clamp(34px,8vw,88px) Georgia,serif;will-change:transform}.controls{justify-content:flex-start}button{min-height:44px;border:1px solid #38372f;border-radius:12px;padding:0 16px;background:#1d1d1a;color:#f4f0e8}input{flex:1;accent-color:#f1bd68}.toggle{display:flex;align-items:center;gap:8px;color:#aaa49a}@media(max-width:600px){.bar{align-items:flex-start;flex-direction:column}.controls{flex-wrap:wrap}.stage{min-height:360px}.card{width:72%}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><main><header class="bar"><div><h1>Vitrine</h1><p>Candidate · true still hold + reciprocal exchange</p></div><p role="status" aria-live="polite" data-status>Frame 1 of 6 · still hold</p></header><section class="stage" aria-label="Vitrine candidate stage" data-stage></section><div class="controls"><button type="button" data-play aria-pressed="false">Play</button><input type="range" min="0" max="12960" value="0" step="1" aria-label="Story time"><label class="toggle"><input type="checkbox" data-reduced>Reduced motion</label></div></main><script type="module" src="./app.mjs"></script></body></html>
