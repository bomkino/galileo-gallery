<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>The Orrery candidate</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0c0c0b;color:#f4f0e8}main{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px}.bar,.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar h1{margin:0;font:600 20px Georgia,serif}.bar p{margin:0;color:#aaa49a;font-size:12px}.stage{position:relative;min-height:420px;overflow:hidden;border:1px solid #38372f;border-radius:18px;background:#11110f;perspective:1200px}.orbit-guide{position:absolute;left:50%;top:50%;border:1px solid rgba(244,240,232,.14);border-radius:50%;transform:translate(-50%,-50%) rotateX(62deg);pointer-events:none}.body{position:absolute;left:50%;top:50%;width:126px;height:80px;display:grid;place-items:center;border-radius:7px;background:var(--c);color:#11110f;font:700 26px Georgia,serif;will-change:transform}.controls{justify-content:flex-start}button{min-height:44px;border:1px solid #38372f;border-radius:12px;padding:0 16px;background:#1d1d1a;color:#f4f0e8}input{flex:1;accent-color:#f1bd68}.toggle{display:flex;align-items:center;gap:8px;color:#aaa49a}@media(max-width:600px){.bar{align-items:flex-start;flex-direction:column}.controls{flex-wrap:wrap}.stage{min-height:360px}.body{width:100px;height:64px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><main><header class="bar"><div><h1>The Orrery</h1><p>G10B preflight candidate · implementation blocked by G10A</p></div><p role="status" aria-live="polite" data-status>Primary body 1 · 18 identities · three rings</p></header><section class="stage" aria-label="The Orrery candidate stage" data-stage></section><div class="controls"><button type="button" data-pl
