<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Orrery — G10B preflight laboratory</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div><p class="eyebrow">ATELIER 04 / G10B PREFLIGHT LAB</p><h1>The Orrery</h1></div><p class="promise">G10B preflight candidate; implementation blocked by G10A.</p></header><section class="workbench"><div class="stage-wrap"><div id="stage" class="stage" aria-label="Orrery deterministic role and orbit laboratory"></div></div><aside aria-label="Prototype controls"><strong>Scene controls</strong><label>Fixture<select id="fixture"></select></label><label>Canvas<select id="canvas"></select></label><label>Ring count<select id="ringCount"><option value="auto">Auto</option><option value="2">2</option><option value="3">3</option></select></label><label>Orbit size<input id="orbitSize" type="range" min="0.25" max="0.48" step="0.01"></label><label>Vertical squash<input id="verticalSquash" type="range" min="0.18" max="0.55" step="0.01"></label><label>Satellite scale<input id="satelliteScale" type="range" min="0.12" max="0.28" step="0.01"></label><label>Orbit pace<input id="orbitPace" type="range" min="0.6" max="1.4" step="0.05"></label><hr><strong>Serialized source/Timeline intent</strong><label>Run<select id="runKind"><option value="loop">Stable-primary loop</option><option value="finite">Finite exchange study</option></select></label><label>Timeline direction<select id="timelineDirection"><option value="forward">Forward</option><option value="reverse">Reverse</option></select></label><label>Primary<select id="primaryId"></select></label><label>Exchange target<select id="exchangeTargetId"></select></label><label class="check"><input id="exchangeEnabled" type="checkbox"> Directed role exchange</label><label class="check"><input id="showGuides" type="checkbox"> Diagnostic orbit guides</label><label class="check"><input id="transparent" type="checkbox"> Transparent stage</label><label class="check"><input id="reducedMotion" type="checkbox"> Reduced motion</label><div class="transport"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button></div><label>Story time<input id="scrub" type="range" min="0" max="1" step="0.0005" value="0"></label><output id="time">0.000</output></aside></section><details open><summary>Exact evaluator readback</summary><pre id="readback"></pre></details></main><script type="module" src="app.mjs"></script></body></html>
