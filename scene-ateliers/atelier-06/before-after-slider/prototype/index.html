<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Before / After — isolated candidate</title><style>:root{font-family:ui-sans-serif,system-ui,sans-serif;color-scheme:dark;background:#111;color:#f7f4ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid #fff2}.toolbar button,.toolbar select{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #fff3;background:#242424;color:inherit;font:inherit}.toolbar output{font-variant-numeric:tabular-nums}.wrap{display:grid;place-items:center;padding:28px}.comparison{position:relative;width:min(86vw,1420px);aspect-ratio:16/9;overflow:hidden;border-radius:22px;background:#0b0b0b;box-shadow:0 22px 70px #0009}.pane{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.pane svg{width:100%;height:100%;display:block}.before{clip-path:inset(0 100% 0 0)}.divider{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 10px #0002;pointer-events:none}.handle{position:absolute;width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;transform:translate(-50%,-50%);top:50%;font-weight:800;pointer-events:none}.label{position:absolute;top:16px;padding:8px 10px;border-radius:8px;background:#111e;font-size:14px}.label.before-label{left:16px}.label.after-label{right:16px}.meta{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 11px;border-radius:9px;background:#111e;font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-aspect-ratio:4/5){.comparison{width:min(88vw,760px);aspect-ratio:4/5}}</style></head><body><header class="toolbar"><button id="play">Pause</button><label>Mode <select id="mode"><option>automatic</option><option>fixed-duration</option><option>directed</option></select></label><label>Divider <select id="orientation"><option>vertical</option><option>horizontal</option></select></label><label>Starts <select id="start"><option value="before">Before</option><option value="after">After</option></select></label><output id="duration">—</output><button id="half">50 / 50</button><button id="reset">Reset</button></header><main class="wrap"><section id="stage" class="comparison" tabindex="0" role="group" aria-label="Before and After comparison"><div class="pane after" aria-label="After"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#466458"/><circle cx="1020" cy="390" r="260" fill="#d8d1a1"/><path d="M0 760 Q500 550 900 760 T1600 700 V900 H0Z" fill="#1d362e"/><text x="70" y="820" font-family="system-ui" font-size="72" fill="white">AFTER</text></svg></div><div id="before" class="pane before" aria-label="Before"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#4e5367"/><circle cx="740" cy="390" r="210" fill="#c0a7a5"/><path d="M0 720 Q450 650 950 740 T1600 650 V900 H0Z" fill="#262a39"/><text x="70" y="820" font-family="system-ui" font-size="72" fill="white">BEFORE</text></svg></div><span class="label before-label">Before</span><span class="label after-label">After</span><div id="divider" class="divider"></div><div id="handle" class="handle" aria-hidden="true">↔</div><output id="meta" class="meta">0%</output></section></main><p id="status" class="sr" aria-live="polite"></p><script type="module">import{compileComparisonTimeline,evaluateComparison}from'./core.mjs';const stage=document.querySelector('#stage'),before=document.querySelector('#before'),divider=document.querySelector('#divider'),handle=document.querySelector('#handle'),meta=document.querySelector('#meta'),status=document.querySelector('#status'),play=document.querySelector('#play'),mode=document.querySelector('#mode'),orientation=document.querySelector('#orientation'),start=document.querySelector('#start'),duration=document.querySelector('#duration'),half=document.querySelector('#half'),reset=document.querySelector('#reset');const items=[{id:'source-before',role:'before',ratio:16/9},{id:'source-after',role:'after',ratio:16/9}];let playing=true,story=0,last=performance.now(),manual=null,raf=0;const timeline=()=>compileComparisonTimeline({mode:mode.value,parameters:{orientation:orientation.value,startSide:start.value},fixedDurationMs:8000});function announce(t){status.textContent='';requestAnimationFrame(()=>status.textContent=t)}function render(){const t=timeline(),state=evaluateComparison({items,timeline:t,timeMs:story,reducedMotion:matchMedia('(prefers-reduced-motion:reduce)').matches,manualReveal:manual});const p=state.reveal*100;if(state.orientation==='vertical'){before.style.clipPath=`inset(0 ${100-p}% 0 0)`;divider.style.cssText=`left:${p}%;top:0;bottom:0;width:2px;height:auto`;handle.style.cssText=`left:${p}%;top:50%`;handle.textContent='↔'}else{before.style.clipPath=`inset(0 0 ${100-p}% 0)`;divider.style.cssText=`top:${p}%;left:0;right:0;height:2px;width:auto`;handle.style.cssText=`left:50%;top:${p}%`;handle.textContent='↕'}meta.value=`${Math.round(p)}% · ${state.segmentId}`;duration.value=`${(t.durationMs/1000).toFixed(2)} s`}function tick(now){if(playing&&manual===null)story+=now-last;last=now;render();raf=requestAnimationFrame(tick)}play.onclick=()=>{playing=!playing;manual=null;play.textContent=playing?'Pause':'Play';announce(playing?'Playback started':'Playback paused')};for(const el of[mode,orientation,start])el.oninput=()=>{story=0;manual=null;render();announce(`${mode.value}, ${orientation.value}, starts ${start.value}`)};half.onclick=()=>{playing=false;play.textContent='Play';manual=.5;render();announce('Comparison set to 50 percent')};reset.onclick=()=>{mode.value='automatic';orientation.value='vertical';start.value='before';playing=true;play.textContent='Pause';manual=null;story=0;render();announce('Comparison reset')};stage.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();play.click();return}const step=e.shiftKey?.1:.02;if(['ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();manual=Math.min(1,(manual??evaluateComparison({items,timeline:timeline(),timeMs:story}).reveal)+step);playing=false;play.textContent='Play';render()}else if(['ArrowLeft','ArrowDown'].includes(e.key)){e.preventDefault();manual=Math.max(0,(manual??evaluateComparison({items,timeline:timeline(),timeMs:story}).reveal)-step);playing=false;play.textContent='Play';render()}else if(e.key==='Home'){e.preventDefault();manual=0;playing=false;render()}else if(e.key==='End'){e.preventDefault();manual=1;playing=false;render()}else if(e.key==='0'){e.preventDefault();half.click()}};addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true});raf=requestAnimationFrame(tick)</script></body></html>
