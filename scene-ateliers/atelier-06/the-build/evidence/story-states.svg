<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420" role="img" aria-labelledby="t d"><title id="t">The Build preflight stage sequence</title><desc id="d">Five deterministic preflight states: world, matte, Project apparatus, intact source, and finale.</desc><rect width="1800" height="420" fill="#171612"/><text x="42" y="50" fill="#f5eddf" font-family="system-ui" font-size="25" letter-spacing="4">WORLD · MATTE · PROJECT APPARATUS · SOURCE · FINALE</text><defs><g id="source"><rect width="250" height="145" rx="10" fill="#554c6c"/><circle cx="175" cy="52" r="38" fill="#daa477"/><path d="M0 120 Q70 70 150 112 T250 100V145H0Z" fill="#28213c"/></g></defs><g transform="translate(56 140)"><rect width="250" height="145" rx="12" fill="#4a4237"/><text x="0" y="190" fill="#aaa" font-family="system-ui" font-size="18">1 · establish world</text></g><g transform="translate(404 140)"><rect x="-20" y="-12" width="250" height="145" rx="12" fill="#4a4237"/><rect width="250" height="145" rx="12" fill="#e5dbc7"/><text x="0" y="190" fill="#aaa" font-family="system-ui" font-size="18">2 · Project matte</text></g><g transform="translate(752 140)"><rect x="-28" y="-18" width="250" height="145" rx="12" fill="#4a4237"/><rect x="-10" y="-6" width="250" height="145" rx="12" fill="#e5dbc7"/><rect x="10" y="10" width="250" height="145" rx="12" fill="none" stroke="#68d0ff" stroke-width="2" stroke-dasharray="7 5"/><line x1="135" y1="10" x2="135" y2="155" stroke="#68d0ff88"/><line x1="10" y1="82" x2="260" y2="82" stroke="#68d0ff88"/><text x="0" y="190" fill="#aaa" font-family="system-ui" font-size="18">3 · Project apparatus</text></g><g transform="translate(1100 140)"><rect x="-28" y="-18" width="250" height="145" rx="12" fill="#4a4237"/><rect x="-10" y="-6" width="250" height="145" rx="12" fill="#e5dbc7"/><use href="#source" transform="translate(10 10)"/><text x="0" y="190" fill="#aaa" font-family="system-ui" font-size="18">4 · intact source</text></g><g transform="translate(1448 140)"><rect x="-28" y="-18" width="250" height="145" rx="12" fill="#4a4237"/><rect x="-10" y="-6" width="250" height="145" rx="12" fill="#e5dbc7"/><use href="#source" transform="translate(10 10)"/><rect x="2" y="2" width="266" height="161" rx="15" fill="none" stroke="#f2d193" stroke-width="3"/><text x="0" y="190" fill="#fff" font-family="system-ui" font-size="18">5 · finale</text></g><rect x="20" y="360" width="1760" height="34" rx="8" fill="#5b2d24"/><text x="900" y="384" text-anchor="middle" fill="#ffe9dc" font-family="system-ui" font-size="18" font-weight="700">G10C PREFLIGHT · STAGES ARE PROJECT APPARATUS, NOT CLAIMED AUTHORSHIP HISTORY</text></svg>
