<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Build — G10C preflight</title><style>:root{font-family:ui-sans-serif,system-ui,sans-serif;color-scheme:dark;background:#11110f;color:#f6f0e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid #fff2}.toolbar button,.toolbar select,.toolbar input{min-height:44px;padding:0 13px;border-radius:12px;border:1px solid #fff3;background:#24231f;color:inherit;font:inherit}.toolbar input{width:110px}.warning{padding:8px 12px;border-radius:10px;background:#5b2d24;color:#ffe9dc}.stage-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;padding:28px;min-height:0}.stage{position:relative;min-height:560px;overflow:hidden;border-radius:24px;background:#1c1b18;perspective:1200px;outline:none}.node{position:absolute;left:50%;top:50%;width:min(66%,960px);aspect-ratio:16/9;transform-origin:center;will-change:transform,opacity;border-radius:18px}.world{background:#4b4337}.matte{background:#e5dbc7;padding:3.5%}.apparatus{border:2px dashed #68d0ff}.apparatus:before,.apparatus:after{content:"";position:absolute;background:#68d0ff88}.apparatus:before{left:50%;top:0;bottom:0;width:1px}.apparatus:after{top:50%;left:0;right:0;height:1px}.source{overflow:hidden;background:#161616}.source svg{width:100%;height:100%;display:block;filter:none;opacity:1}.finale{pointer-events:none;border:2px solid #f3d394;box-shadow:0 0 0 10px #f3d39410}.ledger{padding:18px;border-radius:20px;background:#1b1a17;align-self:stretch}.ledger h1{margin:0 0 8px;font-size:20px}.ledger .flag{display:inline-block;margin-bottom:18px;padding:7px 9px;border-radius:8px;background:#5b2d24;color:#ffe9dc;font-size:13px;font-weight:700}.ledger ol{margin:0;padding-left:24px}.ledger li{padding:9px 4px;color:#aaa}.ledger li.done{color:#ddd}.ledger li.active{color:#fff;font-weight:700}.meta{position:absolute;left:18px;bottom:18px;padding:9px 11px;border-radius:9px;background:#111e;font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:900px){.stage-wrap{grid-template-columns:1fr}.ledger{min-height:260px}}@media(max-aspect-ratio:4/5){.node{width:min(72%,650px);aspect-ratio:4/5}}</style></head><body><header class="toolbar"><button id="play">Pause</button><label>Mode <select id="mode"><option>automatic</option><option>fixed-duration</option><option>directed</option></select></label><label>Direction <select id="direction"><option>forward</option><option>reverse</option></select></label><label>Fixed ms <input id="fixed" type="number" min="1000" step="100" value="11600"></label><label><input id="matteToggle" type="checkbox" checked> Matte</label><label><input id="apparatusToggle" type="checkbox" checked> Guides + caption</label><button id="finale">Finale</button><button id="reset">Reset</button><output id="warning" class="warning" hidden></output></header><main class="stage-wrap"><section id="stage" class="stage" tabindex="0" aria-label="The Build flat-source preflight"><div class="node world" data-stage="world"></div><div class="node matte" data-stage="matte"></div><div class="node apparatus" data-stage="guides-caption"></div><div class="node source" data-stage="source"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#554c6c"/><circle cx="1080" cy="330" r="245" fill="#daa477"/><path d="M0 760 Q430 520 900 720 T1600 640V900H0Z" fill="#28213c"/><text x="68" y="820" fill="white" font-family="system-ui" font-size="67">INTACT SOURCE · NOT INFERRED PROCESS</text></svg></div><div class="node finale" data-stage="finale"></div><output id="meta" class="meta">—</output></section><aside class="ledger"><span class="flag">G10C PREFLIGHT · NOT AUTHORED PROCESS</span><h1>Stage ledger</h1><p id="durationInfo">—</p><ol id="stages"></ol></aside></main><p id="status" class="sr" aria-live="polite"></p><script type="module">import{compileBuildTimeline,evaluateBuildPreflight}from'./core.mjs';const stage=document.querySelector('#stage'),nodes=new Map([...stage.querySelectorAll('[data-stage]')].map(n=>[n.dataset.stage,n])),play=document.querySelector('#play'),mode=document.querySelector('#mode'),direction=document.querySelector('#direction'),fixed=document.querySelector('#fixed'),matteToggle=document.querySelector('#matteToggle'),apparatusToggle=document.querySelector('#apparatusToggle'),finaleButton=document.querySelector('#finale'),reset=document.querySelector('#reset'),warning=document.querySelector('#warning'),meta=document.querySelector('#meta'),durationInfo=document.querySelector('#durationInfo'),stagesList=document.querySelector('#stages'),status=document.querySelector('#status');let playing=true,story=0,last=performance.now(),manualFinale=false,raf=0;const item=()=>({id:'final-source',ratio:16/9,caption:apparatusToggle.checked?'Project caption':''});const apparatus=()=>({matte:matteToggle.checked,guides:apparatusToggle.checked});function compile(){return compileBuildTimeline({mode:mode.value,item:item(),apparatus:apparatus(),parameters:{direction:direction.value},fixedDurationMs:Number(fixed.value)})}function announce(t){status.textContent='';requestAnimationFrame(()=>status.textContent=t)}function render(){let t;try{t=compile();warning.hidden=true}catch(error){warning.value=String(error.message);warning.hidden=false;playing=false;play.textContent='Play';return}const r=stage.getBoundingClientRect(),state=evaluateBuildPreflight({item:item(),timeline:t,timeMs:manualFinale?t.durationMs-1:story,stageWidth:r.width,stageHeight:r.height,reducedMotion:matchMedia('(prefers-reduced-motion:reduce)').matches||manualFinale});const current=new Map(state.established.map(x=>[x.stageId,x]));for(const[id,node]of nodes){const p=current.get(id);node.hidden=!p;if(p){node.style.opacity=p.opacity;node.style.transform=`translate3d(calc(-50% + ${p.x}px),calc(-50% + ${p.y}px),${p.z}px) scale(${p.scale})`}}meta.value=`${state.activeStageId} · ${state.stageIndex+1}/${state.stageCount}`;durationInfo.textContent=`${(t.durationMs/1000).toFixed(2)} s · readable floor ${(t.readableFloorMs/1000).toFixed(2)} s`;stagesList.replaceChildren(...t.stages.map((s,i)=>{const li=document.createElement('li');li.textContent=s.label;li.className=i<state.stageIndex?'done':i===state.stageIndex?'active':'';return li}))}function tick(now){if(playing&&!manualFinale)story+=now-last;last=now;render();raf=requestAnimationFrame(tick)}play.onclick=()=>{playing=!playing;manualFinale=false;play.textContent=playing?'Pause':'Play';announce(playing?'Playback started':'Playback paused')};for(const el of[mode,direction,fixed,matteToggle,apparatusToggle])el.oninput=()=>{story=0;manualFinale=false;render();announce(`${mode.value}; duration ${fixed.value} milliseconds`)};finaleButton.onclick=()=>{playing=false;play.textContent='Play';manualFinale=true;render();announce('Finale shown; this remains a preflight')};reset.onclick=()=>{mode.value='automatic';direction.value='forward';fixed.value='11600';matteToggle.checked=true;apparatusToggle.checked=true;playing=true;manualFinale=false;story=0;play.textContent='Pause';render();announce('The Build preflight reset')};stage.onkeydown=e=>{let t;try{t=compile()}catch{return}if(e.code==='Space'){e.preventDefault();play.click()}else if(e.key==='End'){e.preventDefault();finaleButton.click()}else if(e.key==='Home'){e.preventDefault();playing=false;manualFinale=false;story=0;render()}else if(e.key==='ArrowRight'){e.preventDefault();playing=false;manualFinale=false;story+=t.durationMs/t.stages.length;render()}else if(e.key==='ArrowLeft'){e.preventDefault();playing=false;manualFinale=false;story-=t.durationMs/t.stages.length;render()}};addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true});raf=requestAnimationFrame(tick)</script></body></html>
