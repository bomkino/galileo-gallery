<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slide Anatomy — isolated candidate</title><style>:root{font-family:ui-sans-serif,system-ui,sans-serif;color-scheme:dark;background:#11110f;color:#f4efe4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid #fff2}.toolbar button,.toolbar select{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #fff3;background:#24231f;color:inherit;font:inherit}.stage-wrap{display:grid;place-items:center;padding:30px;perspective:1200px}.stage{position:relative;width:min(82vw,1280px);aspect-ratio:16/9;outline:none}.plane{position:absolute;inset:13%;border-radius:18px;transform-style:preserve-3d;will-change:transform}.world{background:#494238;border:1px solid #fff2}.matte{background:#e7ddc8;padding:3.5%;box-shadow:0 18px 46px #0006}.source{overflow:hidden;background:#161616}.source svg{width:100%;height:100%;display:block;filter:none;opacity:1}.guides{pointer-events:none;border:1px dashed #7ad3ff}.guides:before,.guides:after{content:"";position:absolute;background:#7ad3ff88}.guides:before{left:50%;top:0;bottom:0;width:1px}.guides:after{top:50%;left:0;right:0;height:1px}.caption{inset:auto 18% 7%;height:56px;padding:14px 18px;background:#151515;border-radius:10px;font-size:20px}.label{position:absolute;right:-148px;top:50%;width:132px;padding:8px 10px;border-radius:8px;background:#111e;font-size:14px;transform:translateY(-50%)}.meta{position:absolute;left:0;bottom:-55px;padding:9px 11px;border-radius:9px;background:#111e;font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-aspect-ratio:4/5){.stage{width:min(84vw,720px);aspect-ratio:4/5}.label{right:auto;left:8px;top:auto;bottom:-44px;width:auto}}</style></head><body><header class="toolbar"><button id="play">Pause</button><label>Mode <select id="mode"><option>automatic</option><option>fixed-duration</option><option>directed</option></select></label><label>Direction <select id="direction"><option>forward</option><option>reverse</option></select></label><label><input id="guidesToggle" type="checkbox" checked> Guides</label><label><input id="captionToggle" type="checkbox" checked> Caption</label><button id="open">Open anatomy</button><button id="reset">Reset</button></header><main class="stage-wrap"><section id="stage" class="stage" tabindex="0" aria-label="Slide Anatomy flat-source preview"><div class="plane world" data-plane="world-backing"><span class="label">World backing</span></div><div class="plane matte" data-plane="matte"><span class="label">Project matte</span></div><div class="plane source" data-plane="source"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#5d4f6c"/><circle cx="1080" cy="340" r="260" fill="#d9a67e"/><path d="M0 760 Q420 520 900 730 T1600 650V900H0Z" fill="#28223a"/><text x="70" y="825" fill="white" font-family="system-ui" font-size="70">ONE INDIVISIBLE SOURCE</text></svg><span class="label">Source plane</span></div><div class="plane guides" data-plane="guides"><span class="label">Project guides</span></div><div class="plane caption" data-plane="caption">Project caption apparatus<span class="label">Caption</span></div><output id="meta" class="meta">closed</output></section></main><p id="status" class="sr" aria-live="polite"></p><script type="module">import{compileAnatomyTimeline,evaluateSlideAnatomy}from'./core.mjs';const stage=document.querySelector('#stage'),play=document.querySelector('#play'),mode=document.querySelector('#mode'),direction=document.querySelector('#direction'),guidesToggle=document.querySelector('#guidesToggle'),captionToggle=document.querySelector('#captionToggle'),openButton=document.querySelector('#open'),reset=document.querySelector('#reset'),meta=document.querySelector('#meta'),status=document.querySelector('#status');const nodes=new Map([...stage.querySelectorAll('[data-plane]')].map(n=>[n.dataset.plane,n]));let playing=true,manualOpen=false,story=0,last=performance.now(),raf=0;const item=()=>({id:'source-slide',ratio:16/9,caption:captionToggle.checked?'Project caption apparatus':''});const apparatus=()=>({worldBacking:true,matte:true,guides:guidesToggle.checked});const timeline=()=>compileAnatomyTimeline({mode:mode.value,item:item(),apparatus:apparatus(),parameters:{direction:direction.value},fixedDurationMs:6800});function announce(t){status.textContent='';requestAnimationFrame(()=>status.textContent=t)}function render(){const t=timeline(),r=stage.getBoundingClientRect(),state=evaluateSlideAnatomy({item:item(),timeline:t,timeMs:story,stageWidth:r.width,stageHeight:r.height,reducedMotion:matchMedia('(prefers-reduced-motion:reduce)').matches||manualOpen});const active=new Set(state.planes.map(p=>p.id));for(const[id,node]of nodes){node.hidden=!active.has(id);if(!node.hidden){const p=state.planes.find(x=>x.id===id);node.style.transform=`translate3d(${p.x}px,${p.y}px,${p.z}px) rotateX(${p.rotateX}deg) rotateY(${p.rotateY}deg)`;node.style.opacity=p.opacity}}meta.value=`${state.state} · ${(t.durationMs/1000).toFixed(2)} s · flat source`;}function tick(now){if(playing&&!manualOpen)story+=now-last;last=now;render();raf=requestAnimationFrame(tick)}play.onclick=()=>{playing=!playing;manualOpen=false;play.textContent=playing?'Pause':'Play';announce(playing?'Playback started':'Playback paused')};for(const el of[mode,direction,guidesToggle,captionToggle])el.oninput=()=>{story=0;manualOpen=false;render();announce(`${mode.value}; ${stateSummary()}`)};function stateSummary(){return`${guidesToggle.checked?'guides':'no guides'}, ${captionToggle.checked?'caption':'no caption'}`}openButton.onclick=()=>{playing=false;play.textContent='Play';manualOpen=true;render();announce('Anatomy opened without motion')};reset.onclick=()=>{mode.value='automatic';direction.value='forward';guidesToggle.checked=true;captionToggle.checked=true;playing=true;manualOpen=false;story=0;play.textContent='Pause';render();announce('Slide Anatomy reset')};stage.onkeydown=e=>{const t=timeline();if(e.code==='Space'){e.preventDefault();play.click()}else if(e.key==='Enter'){e.preventDefault();openButton.click()}else if(e.key==='Home'){e.preventDefault();playing=false;manualOpen=false;story=0;render()}else if(e.key==='End'){e.preventDefault();openButton.click()}else if(e.key==='ArrowRight'){e.preventDefault();playing=false;manualOpen=false;story+=t.durationMs/20;render()}else if(e.key==='ArrowLeft'){e.preventDefault();playing=false;manualOpen=false;story-=t.durationMs/20;render()}};addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true});raf=requestAnimationFrame(tick)</script></body></html>
