name: Native Drift colour boundary
on:
  push:
    branches: [codex/native-mac-drift-backgrounds]
    paths: [.github/workflows/import-drift-backgrounds.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Inspect the actual encode and decode colours without changing assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/Sources/GalileoNative/Export.swift');s=p.read_text()
          needle='                    let timestamp=CMTime(value:frame*schedule.rate.denominator,timescale:Int32(schedule.rate.numerator))'
          insert='''                    if frame == 0 {
                                  CVPixelBufferLockBaseAddress(buffer, .readOnly)
                                  if let base=CVPixelBufferGetBaseAddress(buffer) {
                                      let q=base.assumingMemoryBound(to:UInt8.self),i=8*CVPixelBufferGetBytesPerRow(buffer)+8*4
                                      print("ENCODE RGB",q[i+2],q[i+1],q[i],"space",rec709,"attachments",CVBufferCopyAttachments(buffer,.shouldPropagate) as Any)
                                  }
                                  CVPixelBufferUnlockBaseAddress(buffer, .readOnly)
                              }
          '''
          assert s.count(needle)==1;p.write_text(s.replace(needle,insert+needle))
          p=Path('native/Tests/GalileoNativeTests/DriftBackgroundRenderTests.swift');s=p.read_text()
          needle='            let expected=try pixels(r.image(snapshot:snapshot,frame:Int64(count)))'
          insert='''
                      if count == 0 {
                          let i=(8*320+8)*4
                          print("PREVIEW RGB", Array(expected[i..<i+3]), "DECODED SRGB", Array(actual[i..<i+3]))
                          print("DECODE SPACE",ci.colorSpace as Any,"attachments",CVBufferCopyAttachments(buffer,.shouldPropagate) as Any)
                          CVPixelBufferLockBaseAddress(buffer,.readOnly)
                          if let base=CVPixelBufferGetBaseAddress(buffer) {
                              let q=base.assumingMemoryBound(to:UInt8.self),offset=8*CVPixelBufferGetBytesPerRow(buffer)+8*4
                              print("DECODE RAW RGB",q[offset+2],q[offset+1],q[offset])
                          }
                          CVPixelBufferUnlockBaseAddress(buffer,.readOnly)
                      }
          '''
          assert s.count(needle)==1;p.write_text(s.replace(needle,needle+insert))
          PY
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          grep -n 'TransferFunction.*=' "$SDK/System/Library/Frameworks/AVFoundation.framework/Versions/A/Headers/AVVideoSettings.h" || true
          mkdir -p evidence
          set -o pipefail
          swift test --package-path native --filter DriftBackgroundRenderTests/testBackgroundSurvivesPackageAndDecodedMovie 2>&1 | tee evidence/colour.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: drift-colour-diagnosis
          path: evidence
          retention-days: 7
