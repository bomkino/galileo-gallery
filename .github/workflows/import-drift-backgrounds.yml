name: Native Drift backgrounds
on:
  push:
    branches: [codex/native-mac-drift-backgrounds]
    paths: [.github/workflows/import-drift-backgrounds.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: bomkino/pitchdog-drift
          ref: 340b5f631c9147890bc775c86a71af315dd17929
          path: .drift-upstream
          persist-credentials: false
      - name: Correct native translation and preserve source on case-insensitive filesystems
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/native-mac-drift-backgrounds
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .drift-upstream rev-parse HEAD)" = 340b5f631c9147890bc775c86a71af315dd17929
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          vendor=Path('native/Vendor/DriftBackgrounds')
          upstream=Path('.drift-upstream')
          names=['src/backgrounds.ts','src/engine/backgroundShader.ts','LICENSE','NOTICE']
          names += ['src/engine/backgroundShaders/'+name+'.ts' for name in ['solid','gradient','aura','paper','void','cuttingMap','grid','wave','atelier']]
          manifest={'repository':'bomkino/pitchdog-drift','commit':'340b5f631c9147890bc775c86a71af315dd17929','files':{}}
          for name in names:
              content=(upstream/name).read_bytes()
              manifest['files'][name]=hashlib.sha256(content).hexdigest()
              dest=vendor/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(content)
          (vendor/'PROVENANCE.json').write_text(json.dumps(manifest,indent=2)+'\n')
          p=Path('scripts/native/generate-drift-backgrounds.py');s=p.read_text()
          old="    return text.split('`',1)[1].rsplit('`',1)[0]"
          new='    declaration = re.search(r"=\\s*/\\*\\s*glsl\\s*\\*/\\s*`", text)\n    assert declaration is not None, "Missing GLSL template declaration"\n    return text[declaration.end():].rsplit(\'`\',1)[0]'
          assert s.count(old)==1;s=s.replace(old,new)
          old="shader=shader.replace('uniform ','')"
          assert s.count(old)==1;s=s.replace(old,old+"\nshader=shader.replace('gl_FragCoord.xy', '(vUv * uResolution)')")
          old="shader=shader.replace('const float ', 'const float ')"
          assert s.count(old)==1;s=s.replace(old,"assert 'gl_' not in shader and 'export const' not in shader and '`' not in shader")
          p.write_text(s)
          p=Path('.gitignore');s=p.read_text();s+='\n# Keep pinned shader source and its licenses on case-insensitive macOS volumes.\n!native/Vendor/\n!native/Vendor/DriftBackgrounds/\n!native/Vendor/DriftBackgrounds/**\n';p.write_text(s)
          PY
          python3 scripts/native/generate-drift-backgrounds.py
          rm -rf .drift-upstream
      - name: Commit the source correction on the candidate
        run: |
          git config user.name 'Chattie Intern'
          git config user.email 'chattie-intern@users.noreply.github.com'
          git add native scripts/native .gitignore
          git add -f native/Vendor/DriftBackgrounds
          git diff --cached --check
          git commit -m 'fix: native shader coordinates, template parsing and vendored source preservation'
          git push origin HEAD:codex/native-mac-drift-backgrounds
      - name: Record exact source and machine
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          sw_vers > evidence/machine.txt
          uname -m >> evidence/machine.txt
          swift --version >> evidence/machine.txt
          test "$(uname -m)" = arm64
          git archive --format=zip HEAD native scripts/native .github/workflows README.md INSTALL.md CHANGELOG.md THIRD_PARTY_NOTICES.md LICENSE docs > evidence/source.zip
      - name: Verify saved settings, native pixels and encoded backgrounds
        run: |
          set -o pipefail
          swift test --package-path native 2>&1 | tee evidence/tests.log
      - name: Build the native app and precompiled Metal library
        id: build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bash scripts/native/package.sh evidence/build 2>&1 | tee evidence/build.log
      - name: Exercise packaged document and export workflow
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          evidence/build/Galileo\ Gallery.app/Contents/MacOS/GalileoGallery --smoke "$PWD/evidence/journey" 2>&1 | tee evidence/journey.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: drift-background-evidence
          path: evidence
          retention-days: 14
