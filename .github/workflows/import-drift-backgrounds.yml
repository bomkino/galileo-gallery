name: Native Drift backgrounds
on:
  push:
    branches: [codex/native-mac-drift-backgrounds]
    paths: [.github/workflows/import-drift-backgrounds.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Match encoder input metadata to the compositor destination colour space
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/native-mac-drift-backgrounds
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/Sources/GalileoNative/Export.swift');s=p.read_text()
          old='                    try renderer.render(snapshot:snapshot,frame:range.start+frame,into:buffer,colorSpace:rec709)'
          new='''                    // The pool may supply an RGB profile unrelated to the output tags.
                              // These bytes are rendered as Rec.709; tell the encoder the same.
                              CVBufferRemoveAttachment(buffer, kCVImageBufferICCProfileKey)
                              CVBufferSetAttachment(buffer, kCVImageBufferCGColorSpaceKey, rec709, .shouldPropagate)
                              CVBufferSetAttachment(buffer, kCVImageBufferColorPrimariesKey, kCVImageBufferColorPrimaries_ITU_R_709_2, .shouldPropagate)
                              CVBufferSetAttachment(buffer, kCVImageBufferTransferFunctionKey, kCVImageBufferTransferFunction_ITU_R_709_2, .shouldPropagate)
                              CVBufferSetAttachment(buffer, kCVImageBufferYCbCrMatrixKey, kCVImageBufferYCbCrMatrix_ITU_R_709_2, .shouldPropagate)
                              try renderer.render(snapshot:snapshot,frame:range.start+frame,into:buffer,colorSpace:rec709)'''
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('native/Sources/GalileoCore/DriftBackground.swift');s=p.read_text();s=s.replace('Motion closes once per authored Galileo cycle','Motion repeats once per authored Galileo cycle');p.write_text(s)
          PY
          python3 scripts/native/generate-drift-backgrounds.py
      - name: Commit the colour correction on the candidate
        run: |
          git config user.name 'Chattie Intern'
          git config user.email 'chattie-intern@users.noreply.github.com'
          git add native
          git diff --cached --check
          git commit -m 'fix: preserve preview colour through native video encoding'
          git push origin HEAD:codex/native-mac-drift-backgrounds
      - name: Record exact source and machine
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          sw_vers > evidence/machine.txt
          uname -m >> evidence/machine.txt
          swift --version >> evidence/machine.txt
          test "$(uname -m)" = arm64
          git archive --format=zip HEAD native scripts/native .github/workflows README.md INSTALL.md CHANGELOG.md THIRD_PARTY_NOTICES.md LICENSE docs > evidence/source.zip
      - name: Verify saved settings, native pixels and encoded backgrounds
        run: |
          set -o pipefail
          swift test --package-path native 2>&1 | tee evidence/tests.log
      - name: Build the native app and precompiled Metal library
        id: build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bash scripts/native/package.sh evidence/build 2>&1 | tee evidence/build.log
      - name: Exercise packaged document and export workflow
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          evidence/build/Galileo\ Gallery.app/Contents/MacOS/GalileoGallery --smoke "$PWD/evidence/journey" 2>&1 | tee evidence/journey.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: drift-background-evidence
          path: evidence
          retention-days: 14
