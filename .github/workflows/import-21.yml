name: Complete native 2.1
on:
  push:
    branches: [codex/native-mac-2-1]
    paths: [.github/workflows/import-21.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reviewed motion and interface correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = codex/native-mac-2-1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess,json,base64,hashlib,lzma,tempfile,pathlib
          shas=['73e942e52b87ab95371530fde5f5737e29c77e18','c2a1c9c56c64159b49e9eba45ee5c028c7da269f','8e5466a2984e12b0a9fa335a500d648d7bbaf134','05ef6d97f6d903f3c14d8c795a30cd9183e58465']
          parts=[]
          for sha in shas:
              r=json.loads(subprocess.check_output(['gh','api','repos/bomkino/galileo-gallery/git/blobs/'+sha]))
              b=base64.b64decode(r['content'])
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              parts.append(b)
          data=b''.join(parts)
          assert len(data)==21412 and hashlib.sha256(data).hexdigest()=='21843b1a349c3406a7d4d3981ad30b55589998fff2ad5e91836b75602c6b5f60'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(data,max_length=1000000)
          assert decoder.eof and not decoder.unused_data
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch);f.flush()
              rows=subprocess.check_output(['git','apply','--numstat',f.name]).decode().splitlines()
              assert rows
              for row in rows:
                  name=row.split('\t',2)[2];p=pathlib.PurePosixPath(name)
                  assert name.startswith(('native/','docs/')) or name in ['README.md','INSTALL.md','CHANGELOG.md']
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '.build' not in p.parts
              subprocess.run(['git','apply','--check',f.name],check=True)
              subprocess.run(['git','apply',f.name],check=True)
          PY
      - name: Commit normal source on candidate only
        run: |
          git config user.name 'Chattie Intern'
          git config user.email 'chattie-intern@users.noreply.github.com'
          git add native docs README.md INSTALL.md CHANGELOG.md
          git commit -m 'fix: continuous Build handoffs, precise canvas inspection and 2.1 release documentation'
          git push origin HEAD:codex/native-mac-2-1
      - name: Record tested identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          sw_vers > evidence/machine.txt
          uname -m >> evidence/machine.txt
          swift --version >> evidence/machine.txt
          test "$(uname -m)" = arm64
          git archive --format=zip HEAD native scripts/native .github/workflows README.md docs INSTALL.md > evidence/source.zip
      - name: Test native regressions
        run: |
          set -o pipefail
          swift test --package-path native 2>&1 | tee evidence/tests.log
      - name: Build native app
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bash scripts/native/package.sh evidence/build 2>&1 | tee evidence/build.log
      - name: Exercise packaged document and export workflow
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          evidence/build/Galileo\ Gallery.app/Contents/MacOS/GalileoGallery --smoke "$PWD/evidence/journey" 2>&1 | tee evidence/journey.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-21-evidence
          path: evidence
          retention-days: 14
