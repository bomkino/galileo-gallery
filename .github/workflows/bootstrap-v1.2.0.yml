name: Apply Galileo Gallery 1.2.0 interface themes

on:
  push:
    branches: [codex/galileo-theme-hygiene-v1.2.0]

permissions:
  contents: write

concurrency:
  group: galileo-gallery-v1-2-theme-hygiene
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: codex/galileo-theme-hygiene-v1.2.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply bounded interface-theme migration
        run: python scripts/bootstrap-v1.2.0.py

      - name: Close preflight, contrast-test, and overflow-diagnostic cracks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper_path = Path("electron/g08-theme-smoke.cjs")
          helper_lines = helper_path.read_text().splitlines()
          matches = [index for index, line in enumerate(helper_lines) if "const numbers = value.match(" in line]
          if len(matches) != 1:
              raise SystemExit(f"contrast parser line mismatch: {len(matches)}")
          index = matches[0]
          indent = helper_lines[index][:len(helper_lines[index]) - len(helper_lines[index].lstrip())]
          helper_lines[index] = indent + r'const numbers = value.match(/[\\d.]+/g)?.map(Number) ?? []'
          helper_path.write_text("\n".join(helper_lines) + "\n")

          old_script = '<script src="./theme-preflight.js"></script>'
          new_script = '<script type="module" src="/theme-preflight.js"></script>'
          for filename in ("index.html", "scripts/verify-design-system.cjs"):
              path = Path(filename)
              text = path.read_text()
              if text.count(old_script) != 1:
                  raise SystemExit(f"theme preflight anchor mismatch in {filename}: {text.count(old_script)}")
              path.write_text(text.replace(old_script, new_script, 1))

          g08_path = Path("electron/g08-interface-smoke.cjs")
          g08 = g08_path.read_text()
          prep_anchor = "        const shell = document.querySelector('.app-shell')\n        const stage = rect('.stage')\n"
          prep_replacement = "\n".join([
              "        const shell = document.querySelector('.app-shell')",
              "        const shellBox = shell.getBoundingClientRect()",
              "        const describeElement = (element) => {",
              "            const box = element.getBoundingClientRect()",
              "            const style = getComputedStyle(element)",
              "            const id = element.id ? '#' + element.id : ''",
              "            const classes = Array.from(element.classList).slice(0, 5).map((name) => '.' + name).join('')",
              "            return {",
              "                element: element.tagName.toLowerCase() + id + classes,",
              "                left: box.left,",
              "                right: box.right,",
              "                width: box.width,",
              "                rightOverflow: box.right - shellBox.right,",
              "                leftOverflow: shellBox.left - box.left,",
              "                clientWidth: element.clientWidth,",
              "                scrollWidth: element.scrollWidth,",
              "                intrinsicOverflow: element.scrollWidth - element.clientWidth,",
              "                overflowX: style.overflowX,",
              "                position: style.position,",
              "                boxSizing: style.boxSizing,",
              "                minWidth: style.minWidth,",
              "                widthStyle: style.width,",
              "                marginLeft: style.marginLeft,",
              "                marginRight: style.marginRight,",
              "                borderLeft: style.borderLeftWidth,",
              "                borderRight: style.borderRightWidth,",
              "            }",
              "        }",
              "        const overflowOffenders = Array.from(shell.querySelectorAll('*'))",
              "            .map(describeElement)",
              "            .filter((item) => item.rightOverflow > 0.25 || item.leftOverflow > 0.25 || item.intrinsicOverflow > 1)",
              "            .sort((a, b) => Math.max(b.rightOverflow, b.leftOverflow, b.intrinsicOverflow) - Math.max(a.rightOverflow, a.leftOverflow, a.intrinsicOverflow))",
              "            .slice(0, 24)",
              "        const stage = rect('.stage')",
              "",
          ])
          if g08.count(prep_anchor) != 1:
              raise SystemExit(f"overflow diagnostic prep anchor mismatch: {g08.count(prep_anchor)}")
          g08 = g08.replace(prep_anchor, prep_replacement, 1)
          shell_anchor = "                scrollHeight: shell.scrollHeight,\n            },\n            headerGeometry: {\n"
          shell_replacement = "                scrollHeight: shell.scrollHeight,\n                box: { left: shellBox.left, right: shellBox.right, width: shellBox.width },\n                overflowOffenders,\n            },\n            headerGeometry: {\n"
          if g08.count(shell_anchor) != 1:
              raise SystemExit(f"overflow diagnostic shell anchor mismatch: {g08.count(shell_anchor)}")
          g08 = g08.replace(shell_anchor, shell_replacement, 1)
          error_anchor = "        if (value.shell.scrollWidth > value.shell.clientWidth + 1) throw new Error(`${key} has horizontally clipped studio content.`)\n"
          error_replacement = "        if (value.shell.scrollWidth > value.shell.clientWidth + 1) throw new Error(`${key} has horizontally clipped studio content: ${JSON.stringify({ shell: value.shell, offenders: value.shell.overflowOffenders })}`)\n"
          if g08.count(error_anchor) != 1:
              raise SystemExit(f"overflow diagnostic error anchor mismatch: {g08.count(error_anchor)}")
          g08_path.write_text(g08.replace(error_anchor, error_replacement, 1))
          PY

      - name: Resolve exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Audit packaged production dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          npm audit --omit=dev --audit-level=high --json > artifacts/security/npm-audit-production.json

      - name: Record full development-tool audit
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit-full.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("artifacts/security/npm-audit-full.json")
          payload = json.loads(source.read_text()) if source.exists() and source.stat().st_size else {}
          summary = {
              "auditReportVersion": payload.get("auditReportVersion"),
              "vulnerabilities": payload.get("metadata", {}).get("vulnerabilities", {}),
              "dependencies": payload.get("metadata", {}).get("dependencies", {}),
          }
          Path("artifacts/security/npm-audit-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Run complete source suite
        run: npm test

      - name: Prepare exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/bootstrap-v1.2.0.py \
            .github/workflows/bootstrap-v1.2.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add system-aware light and dark modes"

      - name: Run real Electron theme, geometry, and interaction proof
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          GALLERY_SOURCE_SHA="$source_sha" GALLERY_SOURCE_TREE="$source_tree" xvfb-run -a npm run verify:g08-renderer

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: galileo-gallery-v1.2.0-theme-layout-proof
          path: artifacts/g08/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: galileo-gallery-v1.2.0-dependency-audit
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14

      - name: Push proved candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
