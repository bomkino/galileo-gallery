name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: galileo-gallery-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          publish=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            command: npm run package:linux
            artifact: release/*-Linux-x86_64.AppImage
          - os: macos-latest
            name: macos
            command: npm run dist:mac
            artifact: release/*-macOS-arm64.dmg
          - os: windows-latest
            name: windows
            command: npm run package:windows
            artifact: release/*-Windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}

      - name: Smoke-test packaged Linux app
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/galileo-gallery-release-smoke.mp4"
          app="$(find release -maxdepth 1 -name '*-Linux-x86_64.AppImage' -print -quit)"
          test -n "$app"
          chmod +x "$app"
          xvfb-run -a env REEL_SMOKE_OUTPUT="$output" "$app" --appimage-extract-and-run --no-sandbox
          test "$(stat -c%s "$output")" -gt 1000
          release/squashfs-root/resources/ffmpeg/ffmpeg -v error -i "$output" -f null - 2>/dev/null || true

      - name: Smoke-test packaged macOS app
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-arm64/Galileo Gallery.app"
          output="$RUNNER_TEMP/galileo-gallery-release-smoke.mp4"
          test -d "$app"
          codesign --force --deep --sign - "$app"
          REEL_SMOKE_OUTPUT="$output" REEL_USER_DATA_DIR="$RUNNER_TEMP/galileo-gallery-release-user-data" \
            "$app/Contents/MacOS/Galileo Gallery"
          test "$(stat -f%z "$output")" -gt 1000
          "$app/Contents/Resources/ffmpeg/ffmpeg" -v error -i "$output" -f null -
          codesign --verify --deep --strict "$app"

      - name: Smoke-test packaged Windows app
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $output = "$env:RUNNER_TEMP\galileo-gallery-release-smoke.mp4"
          $env:REEL_SMOKE_OUTPUT = $output
          $env:REEL_USER_DATA_DIR = "$env:RUNNER_TEMP\galileo-gallery-release-user-data"
          & "release\win-unpacked\Galileo Gallery.exe"
          $deadline = (Get-Date).AddSeconds(90)
          while ((!(Test-Path $output) -or (Get-Item $output).Length -lt 1000) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (!(Test-Path $output)) { throw "Packaged Windows export did not finish." }
          if ((Get-Item $output).Length -lt 1000) { throw "Packaged Windows export was empty." }

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and write checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}"
          (
            cd release-assets
            sha256sum ./* > SHA256SUMS.txt
          )
      - name: Publish exact-version release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/v${VERSION}.md"
          if test ! -f "$notes"; then
            printf '# Galileo Gallery %s\n\nAutomated cross-platform release.\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
            notes="$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Galileo Gallery ${VERSION}" \
            --notes-file "$notes" \
            release-assets/*
