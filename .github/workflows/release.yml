name: Native Mac release
on:
  push:
    branches: [main]
    paths: ['native/VERSION', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: galileo-native-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve version without replacing an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          version="$(cat native/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; refusing to replace it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists; review it before publishing." >&2
            exit 1
          fi
      - name: Record exact build identity
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD > native-evidence/source.txt
          sw_vers > native-evidence/machine.txt
          uname -m >> native-evidence/machine.txt
          swift --version >> native-evidence/machine.txt
      - name: Test native contracts
        run: |
          set -o pipefail
          swift test --package-path native 2>&1 | tee native-evidence/tests.log
      - name: Build the native app
        run: |
          set -o pipefail
          bash scripts/native/package.sh native-evidence/build 2>&1 | tee native-evidence/build.log
      - name: Exercise document saving, playback and export in the packaged app
        run: |
          set -o pipefail
          native-evidence/build/Galileo\ Gallery.app/Contents/MacOS/GalileoGallery --smoke "$PWD/native-evidence/journey" 2>&1 | tee native-evidence/journey.log
      - name: Package and verify the DMG and ZIP
        run: |
          set -o pipefail
          bash scripts/native/distribute.sh 'native-evidence/build/Galileo Gallery.app' release-native 2>&1 | tee native-evidence/distribution.log
          git diff --exit-code
      - name: Prepare durable release evidence and notes
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          root=pathlib.Path('native-evidence')
          journey=json.loads((root/'journey/journey.json').read_text())
          assert journey['documentRoundTrip'] and journey['nativeAutosave'] and journey['previewAdvancesDuringPlayback']
          assert journey['failedSavePreservesChanges'] and journey['spotlightSavedAndReopened']
          assert journey['nativeMovieDecodedFrames']==62
          with zipfile.ZipFile(f"release-native/Galileo.Gallery-{os.environ['VERSION']}-validation.zip",'w',zipfile.ZIP_DEFLATED) as archive:
              for f in sorted(root.rglob('*')):
                  if f.is_file() and 'build' not in f.relative_to(root).parts:
                      archive.write(f,str(f.relative_to(root)))
          notes=pathlib.Path(f"docs/releases/v{os.environ['VERSION']}.md").read_text()
          notes += '\n\n## Release build evidence\n\n'
          notes += f"Source: `{os.environ['GITHUB_SHA']}`\n\n"
          notes += f"[Build and checks](https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}). "
          notes += 'The attached validation ZIP records the actual machine, tests, document journey and synthetic output.\n'
          pathlib.Path('native-evidence/release-notes.md').write_text(notes)
          PY
          (cd release-native && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-release-evidence
          path: native-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: native-mac-distribution
          path: release-native
          if-no-files-found: error
          retention-days: 14
      - name: Publish matching assets as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-native/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Galileo Gallery $VERSION" --notes-file native-evidence/release-notes.md --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
