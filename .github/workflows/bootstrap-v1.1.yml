name: Apply Galileo Gallery 1.1.0 design system

on:
  push:
    branches: [codex/pitchdog-type-phosphor-v1.1.0]

permissions:
  contents: write

concurrency:
  group: galileo-gallery-v1-1-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: codex/pitchdog-type-phosphor-v1.1.0

      - uses: actions/checkout@v5
        with:
          repository: bomkino/pitchdog-type-system
          ref: 786b4a2b671182319320f922b8de8f927ea3a002
          path: .type-system-source
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply pinned design-system migration
        run: node scripts/bootstrap-v1.1.mjs

      - name: Resolve exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Run source and build verification
        run: npm test

      - name: Prepare final candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .type-system-source
          rm -f scripts/bootstrap-v1.1.mjs .github/workflows/bootstrap-v1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: adopt pitch.dog type and Phosphor icons"

      - name: Run real Electron layout, scale, and screenshot proof
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          GALLERY_SOURCE_SHA="$source_sha" GALLERY_SOURCE_TREE="$source_tree" xvfb-run -a npm run verify:g08-renderer

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: galileo-gallery-v1.1-layout-proof
          path: artifacts/g08/
          if-no-files-found: warn
          retention-days: 14

      - name: Push proved candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
