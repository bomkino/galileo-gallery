name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  package-linux:
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:linux
      - name: Export from the packaged AppImage
        run: xvfb-run -a env REEL_SMOKE_OUTPUT=./release/ci-smoke.mp4 release/*-Linux-x86_64.AppImage --appimage-extract-and-run --no-sandbox
      - run: node -e "if (require('fs').statSync('release/ci-smoke.mp4').size < 1000) process.exit(1)"
      - uses: actions/upload-artifact@v6
        with:
          name: galileo-gallery-linux
          path: release/*.AppImage

  package-macos:
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - name: Export from the packaged macOS app
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-arm64/Galileo Gallery.app"
          output="$RUNNER_TEMP/galileo-gallery-smoke.mp4"
          # electron-builder skips signing on pull-request runners, including ad-hoc signing.
          codesign --force --deep --sign - "$app"
          REEL_SMOKE_OUTPUT="$output" REEL_USER_DATA_DIR="$RUNNER_TEMP/galileo-gallery-user-data" \
            "$app/Contents/MacOS/Galileo Gallery"
          test "$(stat -f%z "$output")" -gt 1000
          "$app/Contents/Resources/ffmpeg/ffmpeg" -v error -i "$output" -f null -
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v6
        with:
          name: galileo-gallery-macos
          path: release/mac-arm64/*.app

  package-windows:
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:windows
      - name: Export from the packaged Windows app
        shell: pwsh
        run: |
          $output = "$pwd\release\ci-smoke.mp4"
          $env:REEL_SMOKE_OUTPUT = $output
          $env:REEL_USER_DATA_DIR = "$env:RUNNER_TEMP\galileo-gallery-smoke"
          & "release\win-unpacked\Galileo Gallery.exe"
          $deadline = (Get-Date).AddSeconds(90)
          while ((!(Test-Path $output) -or (Get-Item $output).Length -lt 1000) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (!(Test-Path $output)) { throw "Packaged Windows export did not finish." }
          if ((Get-Item $output).Length -lt 1000) { throw "Packaged Windows export was empty." }
      - uses: actions/upload-artifact@v6
        with:
          name: galileo-gallery-windows
          path: release/*.exe

  renderer-g02:
    if: github.ref_name == 'main' || github.ref_name == 'codex/g02-quiet-carousel-tracer' || github.ref_name == 'codex/g03-linux-host-port' || github.ref_name == 'codex/g05-deterministic-audio' || github.ref_name == 'codex/g06-verified-png-export' || github.ref_name == 'codex/g06b-verified-h264-aac' || github.ref_name == 'codex/g08-interface-scale-ui' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:electron
      - name: Configure Electron sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run the real Quiet Carousel renderer journey
        run: xvfb-run -a npm run verify:g02-renderer
      - uses: actions/upload-artifact@v6
        with:
          name: g02-quiet-carousel-renderer-evidence
          path: artifacts/g02/
      - name: Run the G03 HostPort save and relaunch journey
        if: github.ref_name == 'main' || github.ref_name == 'codex/g03-linux-host-port' || github.ref_name == 'codex/g05-deterministic-audio' || github.ref_name == 'codex/g06-verified-png-export' || github.ref_name == 'codex/g06b-verified-h264-aac' || github.ref_name == 'codex/g08-interface-scale-ui' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/g03
          source_sha="$GITHUB_SHA"
          source_tree="$(git rev-parse HEAD^{tree})"
          GALLERY_SOURCE_SHA="$source_sha" GALLERY_SOURCE_TREE="$source_tree" npm run package:linux:g03
          sudo chown root:root release/g03/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/g03/linux-unpacked/chrome-sandbox
          executable="$PWD/release/g03/linux-unpacked/galileo-gallery"
          test -x "$executable"
          npm run verify:packaged-ffmpeg
          source_media="$PWD/build/icon.png"
          project="$PWD/artifacts/g03/round-trip.galileo"
          user_data="$PWD/artifacts/g03-runtime"
          xvfb-run -a env \
            REEL_USER_DATA_DIR="$user_data" \
            REEL_G03_RENDERER_OUTPUT="$PWD/artifacts/g03" \
            REEL_G03_RENDERER_MODE=save \
            REEL_G03_MEDIA_SOURCES="$source_media" \
            REEL_G03_PROJECT_PATH="$project" \
            "$executable"
          xvfb-run -a env \
            REEL_USER_DATA_DIR="$user_data" \
            REEL_G03_RENDERER_OUTPUT="$PWD/artifacts/g03" \
            REEL_G03_RENDERER_MODE=reopen \
            REEL_G03_PROJECT_PATH="$project" \
            "$executable"
          G03_EXPECTED_SHA="$source_sha" G03_EXPECTED_TREE="$source_tree" npm run verify:g03-renderer
      - uses: actions/upload-artifact@v6
        if: github.ref_name == 'main' || github.ref_name == 'codex/g03-linux-host-port' || github.ref_name == 'codex/g05-deterministic-audio' || github.ref_name == 'codex/g06-verified-png-export' || github.ref_name == 'codex/g06b-verified-h264-aac' || github.ref_name == 'codex/g08-interface-scale-ui' || github.event_name == 'pull_request'
        with:
          name: g03-linux-host-port-renderer-evidence
          path: artifacts/g03/
      - name: Run the G06 verified PNG and H.264 success and cancellation journeys
        if: github.ref_name == 'main' || github.event_name == 'pull_request' || github.ref_name == 'codex/g06-verified-png-export' || github.ref_name == 'codex/g06b-verified-h264-aac' || github.ref_name == 'codex/g08-interface-scale-ui'
        shell: bash
        run: |
          set -euo pipefail
          executable="$PWD/release/g03/linux-unpacked/galileo-gallery"
          project="$PWD/artifacts/g06/quiet.galileo"
          success="$PWD/artifacts/g06/png-success"
          cancelled="$PWD/artifacts/g06/png-cancelled"
          mkdir -p "$PWD/artifacts/g06"
          fixtures="$(node scripts/create-g05-audio-fixtures.cjs "$PWD/artifacts/g06-fixtures")"
          presenter="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).presenter)' "$fixtures")"
          node scripts/create-g06-smoke-project.cjs "$project" "$PWD/build/icon.png" "$presenter"
          xvfb-run -a env \
            REEL_USER_DATA_DIR="$PWD/artifacts/g06-runtime-success" \
            REEL_G06_RENDERER_OUTPUT="$PWD/artifacts/g06/evidence-success" \
            REEL_G06_PNG_DESTINATION="$success" \
            REEL_G03_PROJECT_PATH="$project" \
            "$executable"
          xvfb-run -a env \
            REEL_USER_DATA_DIR="$PWD/artifacts/g06-runtime-cancel" \
            REEL_G06_RENDERER_OUTPUT="$PWD/artifacts/g06/evidence-cancel" \
            REEL_G06_RENDERER_MODE=cancel \
            REEL_G06_PNG_DESTINATION="$cancelled" \
            REEL_G03_PROJECT_PATH="$project" \
            "$executable"
          test ! -e "$cancelled"
          if test "$GITHUB_REF_NAME" = codex/g06b-verified-h264-aac || test "$GITHUB_REF_NAME" = codex/g08-interface-scale-ui || test "$GITHUB_REF_NAME" = main || test "$GITHUB_EVENT_NAME" = pull_request; then
            h264_success="$PWD/artifacts/g06/h264-success.mp4"
            h264_cancelled="$PWD/artifacts/g06/h264-cancelled.mp4"
            xvfb-run -a env \
              REEL_USER_DATA_DIR="$PWD/artifacts/g06-runtime-h264-success" \
              REEL_G06_RENDERER_OUTPUT="$PWD/artifacts/g06/evidence-h264-success" \
              REEL_G06_RENDERER_MODE=h264-success \
              REEL_G06_H264_DESTINATION="$h264_success" \
              REEL_G03_PROJECT_PATH="$project" \
              "$executable"
            xvfb-run -a env \
              REEL_USER_DATA_DIR="$PWD/artifacts/g06-runtime-h264-cancel" \
              REEL_G06_RENDERER_OUTPUT="$PWD/artifacts/g06/evidence-h264-cancel" \
              REEL_G06_RENDERER_MODE=h264-cancel \
              REEL_G06_H264_DESTINATION="$h264_cancelled" \
              REEL_G03_PROJECT_PATH="$project" \
              "$executable"
            test ! -e "$h264_cancelled"
          fi
      - uses: actions/upload-artifact@v6
        if: github.ref_name == 'main' || github.event_name == 'pull_request' || github.ref_name == 'codex/g06-verified-png-export' || github.ref_name == 'codex/g06b-verified-h264-aac' || github.ref_name == 'codex/g08-interface-scale-ui'
        with:
          name: g06-verified-export-renderer-evidence
          path: artifacts/g06/
      - name: Run the G05 deterministic audio save and reopen journey
        if: github.ref_name == 'codex/g05-deterministic-audio'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/g05
          source_sha="$GITHUB_SHA"
          source_tree="$(git rev-parse HEAD^{tree})"
          executable="$PWD/release/g03/linux-unpacked/galileo-gallery"
          test -x "$executable"
          fixtures="$(node scripts/create-g05-audio-fixtures.cjs artifacts/g05-fixtures)"
          presenter="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).presenter)' "$fixtures")"
          soundtrack="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).soundtrack)' "$fixtures")"
          video="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).video)' "$fixtures")"
          project="$PWD/artifacts/g05/round-trip.galileo"
          user_data="$PWD/artifacts/g05-runtime"
          for mode in save reopen; do
            xvfb-run -a env \
              REEL_USER_DATA_DIR="$user_data" \
              REEL_G05_RENDERER_OUTPUT="$PWD/artifacts/g05" \
              REEL_G05_RENDERER_MODE="$mode" \
              REEL_G03_MEDIA_SOURCES="$PWD/build/icon.png:$video" \
              REEL_G03_PROJECT_PATH="$project" \
              REEL_G05_PRESENTER_SOURCE="$presenter" \
              REEL_G05_SOUNDTRACK_SOURCE="$soundtrack" \
              REEL_G05_VIDEO_SOURCE="$video" \
              "$executable"
          done
          G05_EXPECTED_SHA="$source_sha" G05_EXPECTED_TREE="$source_tree" npm run verify:g05-renderer
      - uses: actions/upload-artifact@v6
        if: github.ref_name == 'codex/g05-deterministic-audio'
        with:
          name: g05-deterministic-audio-renderer-evidence
          path: artifacts/g05/

  renderer-g08:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'codex/') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:electron
      - name: Configure Electron sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run the Gallery interface and scale journey
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          source_tree="$(git rev-parse HEAD^{tree})"
          GALLERY_SOURCE_SHA="$source_sha" GALLERY_SOURCE_TREE="$source_tree" xvfb-run -a npm run verify:g08-renderer
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g08-interface-renderer-evidence
          path: artifacts/g08/

  renderer-g11:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'codex/g11-') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build exact hardened Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          source_tree="$(git rev-parse HEAD^{tree})"
          GALLERY_SOURCE_SHA="$source_sha" GALLERY_SOURCE_TREE="$source_tree" npm run package:linux:g03
          sudo chown root:root release/g03/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/g03/linux-unpacked/chrome-sandbox
          npm run verify:packaged-ffmpeg
      - name: Run two real Vitrine preview and PNG journeys
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          source_tree="$(git rev-parse HEAD^{tree})"
          executable="$PWD/release/g03/linux-unpacked/galileo-gallery"
          app_asar="$PWD/release/g03/linux-unpacked/resources/app.asar"
          root="$PWD/artifacts/g11"
          test -x "$executable"
          test -f "$app_asar"
          mkdir -p "$root"
          GALLERY_SOURCE_SHA="$source_sha" \
          GALLERY_SOURCE_TREE="$source_tree" \
          G11_EXPECTED_EXECUTABLE_SHA="$(sha256sum "$executable" | cut -d' ' -f1)" \
          G11_EXPECTED_APP_ASAR_SHA="$(sha256sum "$app_asar" | cut -d' ' -f1)" \
          REEL_G11_ARTIFACTS="$root" \
          REEL_G11_EXECUTABLE="$executable" \
          xvfb-run -a node scripts/run-g11-renderer.cjs
      - name: Re-run packaged PNG cancellation after G11 runtime changes
        shell: bash
        run: |
          set -euo pipefail
          executable="$PWD/release/g03/linux-unpacked/galileo-gallery"
          project="$PWD/artifacts/g11-regression/quiet.galileo"
          cancelled="$PWD/artifacts/g11-regression/png-cancelled"
          mkdir -p "$PWD/artifacts/g11-regression"
          fixtures="$(node scripts/create-g05-audio-fixtures.cjs "$PWD/artifacts/g11-regression-fixtures")"
          presenter="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).presenter)' "$fixtures")"
          node scripts/create-g06-smoke-project.cjs "$project" "$PWD/build/icon.png" "$presenter"
          xvfb-run -a env \
            REEL_USER_DATA_DIR="$PWD/artifacts/g11-regression-runtime" \
            REEL_G06_RENDERER_OUTPUT="$PWD/artifacts/g11-regression/evidence-cancel" \
            REEL_G06_RENDERER_MODE=cancel \
            REEL_G06_PNG_DESTINATION="$cancelled" \
            REEL_G03_PROJECT_PATH="$project" \
            "$executable"
          test ! -e "$cancelled"
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: g11-vitrine-renderer-evidence
          path: artifacts/g11/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: g11-png-cancellation-regression-evidence
          path: artifacts/g11-regression/
          if-no-files-found: error
