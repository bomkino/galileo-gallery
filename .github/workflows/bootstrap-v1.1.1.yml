name: Apply Galileo Gallery 1.1.1 layout polish

on:
  push:
    branches: [codex/galileo-layout-motion-v1.1.1]

permissions:
  contents: write

concurrency:
  group: galileo-gallery-v1-1-1-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: codex/galileo-layout-motion-v1.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply geometry and motion polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/bootstrap-v1.1.1.mjs")
          text = path.read_text()
          anchor = 'const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..")'
          replacement = "const PRESENTATION_KEY = '${PRESENTATION_KEY}'\nconst PROJECT_KEY = '${PROJECT_KEY}'\n\n" + anchor
          duplicate_guard = '    assert(text.indexOf(search, first + search.length) < 0, `duplicate ${label}`)\n'
          if text.count(anchor) != 1:
              raise SystemExit("bootstrap constant anchor mismatch")
          if text.count(duplicate_guard) != 1:
              raise SystemExit("bootstrap duplicate guard mismatch")
          text = text.replace(anchor, replacement, 1)
          text = text.replace(duplicate_guard, "", 1)
          path.write_text(text)
          PY
          node scripts/bootstrap-v1.1.1.mjs
          python - <<'PY'
          from pathlib import Path

          verify_path = Path("scripts/verify-design-system.cjs")
          verify = verify_path.read_text()
          verify_anchor = '    assert(icon.includes(`${name}:`), `Phosphor icon map is missing ${name}`)\n'
          verify_replacement = '    const key = name.includes("-") ? `"${name}":` : `${name}:`\n    assert(icon.includes(key), `Phosphor icon map is missing ${name}`)\n'
          if verify.count(verify_anchor) != 1:
              raise SystemExit("icon verifier anchor mismatch")
          verify_path.write_text(verify.replace(verify_anchor, verify_replacement, 1))

          app_path = Path("src/App.tsx")
          app = app_path.read_text()
          focus_anchor = '        if (restoreFocus) requestAnimationFrame(() => triggerRef.current?.focus())\n'
          focus_replacement = (
              '        if (restoreFocus) {\n'
              '            triggerRef.current?.focus({ preventScroll: true })\n'
              '            requestAnimationFrame(() => triggerRef.current?.focus({ preventScroll: true }))\n'
              '        }\n'
          )
          if app.count(focus_anchor) != 1:
              raise SystemExit("Project focus restoration anchor mismatch")
          app_path.write_text(app.replace(focus_anchor, focus_replacement, 1))

          g08_path = Path("electron/g08-interface-smoke.cjs")
          g08 = g08_path.read_text()
          error_anchor = "        throw new Error('Project menu did not close cleanly and restore trigger focus.')\n"
          error_replacement = "        throw new Error('Project menu did not close cleanly and restore trigger focus: ' + JSON.stringify(result.closed))\n"
          if g08.count(error_anchor) != 1:
              raise SystemExit("Project disclosure diagnostic anchor mismatch")
          g08_path.write_text(g08.replace(error_anchor, error_replacement, 1))
          PY

      - name: Resolve exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete source suite
        run: npm test

      - name: Prepare proved candidate commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/bootstrap-v1.1.1.mjs .github/workflows/bootstrap-v1.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: polish interface geometry and disclosure motion"

      - name: Run real Electron layout and interaction proof
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          GALLERY_SOURCE_SHA="$source_sha" GALLERY_SOURCE_TREE="$source_tree" xvfb-run -a npm run verify:g08-renderer

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: galileo-gallery-v1.1.1-layout-proof
          path: artifacts/g08/
          if-no-files-found: warn
          retention-days: 14

      - name: Push proved candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
