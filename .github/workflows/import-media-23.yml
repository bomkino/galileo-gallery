name: Native media integration
on:
  push:
    branches: [codex/native-mac-media-2-3]
    paths: [.github/workflows/import-media-23.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commit reviewed release documentation and packaging on the candidate
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/native-mac-media-2-3
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess,json,base64,hashlib,lzma,pathlib
          shas=['76144c0e1a0879972f553f70c8f7300ffa1e27ce','03bbb6dcce666e105cd961a6e5029854835c1b0d','1fd51d4528168da7d775121151eacafefcbe0cbb','45a9bc76ffc9759edab407291eba003ceac037ad']
          def blob_hash(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          parts=[]
          for sha in shas:
              obj=json.loads(subprocess.check_output(['gh','api','repos/bomkino/galileo-gallery/git/blobs/'+sha]))
              part=base64.b64decode(obj['content']);assert blob_hash(part)==sha;parts.append(part)
          data=b''.join(parts)
          assert len(data)==23208 and hashlib.sha256(data).hexdigest()=='c591460b84ab939faaeb86045d6216a49f07e35a8b4091b4ad8326ca0c443d05'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          decoded=decoder.decompress(data,max_length=200000)
          assert decoder.eof and not decoder.unused_data and len(decoded)==72137
          payload=json.loads(decoded)
          for name,item in payload['files'].items():
              p=pathlib.Path(name)
              assert name.startswith(('native/','scripts/native/','docs/')) or name in ['README.md','INSTALL.md','CONTRIBUTING.md','THIRD_PARTY_NOTICES.md']
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '.build' not in p.parts
              assert not p.is_symlink()
              if item['expected'] is None:assert not p.exists(),name
              else:assert blob_hash(p.read_bytes())==item['expected'],name
          p=pathlib.Path('CHANGELOG.md')
          assert blob_hash(p.read_bytes())==payload['changelogExpected']
          for name,item in payload['files'].items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(item['content']);p.chmod(0o755 if item['executable'] else 0o644)
          text=pathlib.Path('CHANGELOG.md').read_text()
          assert text.startswith('# Changelog\n\n')
          pathlib.Path('CHANGELOG.md').write_text('# Changelog\n\n'+payload['changelogHeader']+text[len('# Changelog\n\n'):])
          PY
          git config user.name 'Chattie Intern'
          git config user.email 'chattie-intern@users.noreply.github.com'
          git add native scripts/native docs README.md INSTALL.md CONTRIBUTING.md THIRD_PARTY_NOTICES.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'release: 2.3 media workflow, corresponding codec source and installation safety'
          git push origin HEAD:codex/native-mac-media-2-3
      - name: Record tested identity
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD > native-evidence/source.txt
          sw_vers > native-evidence/machine.txt
          uname -m >> native-evidence/machine.txt
          swift --version >> native-evidence/machine.txt
          test "$(uname -m)" = arm64
          git archive --format=zip HEAD native scripts/native .github/workflows README.md docs INSTALL.md LICENSE CONTRIBUTING.md CHANGELOG.md THIRD_PARTY_NOTICES.md > native-evidence/source.zip
      - uses: actions/cache@v4
        with:
          path: native/.codecs
          key: galileo-codecs-arm64-${{ hashFiles('scripts/native/build-codecs.sh') }}
      - name: Prepare pinned local media helpers
        run: |
          set -o pipefail
          bash scripts/native/build-codecs.sh 2>&1 | tee native-evidence/codecs.log
          bash -n scripts/native/install-latest.sh
      - name: Verify media, timing and rendering contracts
        run: |
          set -o pipefail
          swift test --package-path native 2>&1 | tee native-evidence/tests.log
      - name: Build the packaged Mac application
        id: build
        run: |
          set -o pipefail
          bash scripts/native/package.sh native-evidence/build 2>&1 | tee native-evidence/build.log
      - name: Exercise packaged document and export journey
        run: |
          set -o pipefail
          GALILEO_MEDIA_FIXTURES="$PWD/native/Tests/GalileoNativeTests/Fixtures" native-evidence/build/Galileo\ Gallery.app/Contents/MacOS/GalileoGallery --smoke "$PWD/native-evidence/journey" 2>&1 | tee native-evidence/journey.log
      - name: Verify installer contents and corresponding codec source
        run: |
          set -o pipefail
          bash scripts/native/distribute.sh 'native-evidence/build/Galileo Gallery.app' release-check 2>&1 | tee native-evidence/distribution.log
          python3 scripts/native/package-codec-source.py 'native-evidence/build/Galileo Gallery.app' release-check 2>&1 | tee native-evidence/codec-source.log
          git diff --exit-code
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-media-evidence
          path: native-evidence
          retention-days: 14
