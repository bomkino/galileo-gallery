name: Native media codecs
on:
  push:
    branches: [codex/native-mac-media-2-3]
    paths: ['scripts/native/build-codecs.sh', '.github/workflows/media-codec-build.yml']
permissions:
  contents: read
jobs:
  codecs:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: native/.codecs
          key: galileo-codecs-arm64-${{ hashFiles('scripts/native/build-codecs.sh') }}
      - name: Build restricted decoders and retain corresponding source
        run: |
          set -o pipefail
          mkdir -p codec-evidence
          bash scripts/native/build-codecs.sh 2>&1 | tee codec-evidence/build.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-codec-evidence
          path: |
            codec-evidence
            native/.codecs/identity.txt
            native/.codecs/SHA256SUMS.txt
            native/.codecs/decoders.txt
            native/.codecs/protocols.txt
          include-hidden-files: true
          retention-days: 14
