name: Native source import and validation
on:
  push:
    branches: [codex/native-mac-rebuild]
    paths: ['.native-delivery/**']
permissions:
  contents: write
concurrency:
  group: native-source-import
  cancel-in-progress: false
jobs:
  import-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksummed, reviewed source correction
        run: |
          python3 - <<'PY'
          import hashlib,json,lzma,pathlib,shutil,subprocess,tempfile
          root=pathlib.Path('.native-delivery')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['format']=='reviewed-unified-diff-xz'
          data=(root/'change.patch.xz').read_bytes()
          assert len(data)==manifest['bytes'] and len(data)<200000
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(data,max_length=1024*1024)
          assert decoder.eof and not decoder.unused_data
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch);f.flush()
              stats=subprocess.check_output(['git','apply','--numstat',f.name]).decode().splitlines()
              assert stats
              for row in stats:
                  name=row.split('\t',2)[2]
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and name.startswith(('native/','scripts/native/'))
                  assert '.build' not in p.parts and '.git' not in p.parts
              subprocess.run(['git','apply','--check',f.name],check=True)
              subprocess.run(['git','apply',f.name],check=True)
          shutil.rmtree(root)
          PY
      - name: Commit normal readable source on the candidate only
        run: |
          git config user.name 'Chattie Intern'
          git config user.email 'chattie-intern@users.noreply.github.com'
          git add --all native scripts/native .native-delivery
          git commit -m 'fix: native overwrite, cancellation, shutdown and time boundaries'
          git push origin HEAD:codex/native-mac-rebuild
      - name: Record tested identity
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD | tee native-evidence/source.txt
          sw_vers | tee native-evidence/machine.txt
          uname -m | tee -a native-evidence/machine.txt
          swift --version | tee -a native-evidence/machine.txt
          test "$(uname -m)" = arm64
      - name: Test native contracts
        run: |
          set -o pipefail
          swift test --package-path native 2>&1 | tee native-evidence/tests.log
      - name: Build native application
        run: |
          set -o pipefail
          bash scripts/native/package.sh native-evidence/build 2>&1 | tee native-evidence/build.log
      - name: Run native document and export journey
        run: |
          set -o pipefail
          native-evidence/build/Galileo\ Gallery.app/Contents/MacOS/GalileoGallery --smoke "$PWD/native-evidence/journey" 2>&1 | tee native-evidence/journey.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-import-evidence
          path: native-evidence
          retention-days: 14
