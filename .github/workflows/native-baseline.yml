name: Native source snapshot
on:
  push:
    branches: [codex/native-mac-rebuild]
    paths: [.github/workflows/native-baseline.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Capture source without build products or fonts
        run: |
          mkdir -p native-source
          git rev-parse HEAD > native-source/commit.txt
          git ls-tree -r HEAD > native-source/tree.txt
          git archive --format=zip HEAD native scripts/native .github/workflows README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md docs > native-source/source.zip
      - uses: actions/upload-artifact@v6
        with:
          name: native-source-snapshot
          path: native-source
          retention-days: 7
