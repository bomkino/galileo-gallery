name: Native document diagnosis
on:
  push:
    branches: [codex/native-mac-rebuild]
    paths: [.github/workflows/native-baseline.yml]
permissions:
  contents: read
jobs:
  document:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Trace the document change notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/Sources/GalileoGallery/Document.swift')
          s=p.read_text().replace('    override func close() {','    override func updateChangeCount(_ change: NSDocument.ChangeType) {\n        super.updateChangeCount(change)\n        Swift.print("CHANGE COUNT", change.rawValue, isDocumentEdited, hasUnautosavedChanges); fflush(stdout)\n    }\n    override func close() {')
          s=s.replace('self.storage.set(session.snapshot) } }','self.storage.set(session.snapshot); Swift.print("EDIT", self.isDocumentEdited, self.hasUnautosavedChanges, session.undoManager?.canUndo as Any, session.undoManager?.isUndoRegistrationEnabled as Any); fflush(stdout) } }')
          p.write_text(s)
          p=Path('native/Sources/GalileoGallery/ApplicationSmoke.swift')
          s=p.read_text().replace('        let expected=editor.project','        Swift.print("BEFORE CHECK", document.isDocumentEdited, document.hasUnautosavedChanges, document.autosavedContentsFileURL as Any); fflush(stdout)\n        let expected=editor.project')
          p.write_text(s)
          PY
      - name: Reproduce in the bundled native app
        run: |
          bash scripts/native/package.sh native-diagnosis
          native-diagnosis/Galileo\ Gallery.app/Contents/MacOS/GalileoGallery --smoke "$RUNNER_TEMP/document-diagnosis"
