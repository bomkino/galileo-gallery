name: Native document diagnosis
on:
  push:
    branches: [codex/native-mac-rebuild]
    paths: [.github/workflows/native-baseline.yml]
permissions:
  contents: read
jobs:
  document:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Compare AppKit-owned undo managers at the failing boundary
        run: |
          cat > /tmp/document-probe.swift <<'SWIFT'
          import AppKit
          final class Model: NSObject { var value = 0 }
          let app = NSApplication.shared
          app.setActivationPolicy(.regular)
          for explicit in [false, true] {
              let document = NSDocument()
              document.hasUndoManager = true
              if explicit { document.undoManager = UndoManager() }
              let manager = document.undoManager!
              manager.groupsByEvent = false
              let model = Model()
              let observer = NotificationCenter.default.addObserver(forName: nil, object: manager, queue: nil) { note in print("notification", note.name.rawValue) }
              print("before", explicit, document.isDocumentEdited, manager.groupingLevel)
              manager.beginUndoGrouping()
              manager.registerUndo(withTarget: model) { target in target.value = 0 }
              model.value = 1
              manager.endUndoGrouping()
              print("after", explicit, document.isDocumentEdited, manager.canUndo)
              RunLoop.current.run(until: Date(timeIntervalSinceNow: 0.05))
              print("after event", document.isDocumentEdited)
              manager.undo()
              print("undo", document.isDocumentEdited, model.value)
              NotificationCenter.default.removeObserver(observer)
          }
          SWIFT
          swift /tmp/document-probe.swift
